services:
  xray:
    image: ${XRAY_IMAGE:-ghcr.io/xtls/xray-core:25.3.6}
    container_name: ${XRAY_CONTAINER_NAME:-xray-vless-reality}
    restart: unless-stopped
    network_mode: host
    user: "0:0"
    read_only: true
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    cap_add:
      - NET_BIND_SERVICE
    volumes:
      - ${XRAY_CONFIG_PATH:-./data/config.json}:/etc/xray/config.json:ro
      - ${XRAY_CERT_DIR:-./certificates}:/etc/xray/certificates:ro
    command: ["run", "-config", "/etc/xray/config.json"]
